# Overlay producción — imágenes pre-construidas en GHCR (ver .github/workflows/build-images.yml).
# Dokploy: usa este archivo junto con docker-compose.yml (sin --build en el VPS).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans --no-build
#
# IMAGE_TAG: sha corto del commit (workflow) o latest (default).

services:
  frontend:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-frontend:${IMAGE_TAG:-latest}

  api:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-api:${IMAGE_TAG:-latest}

  ingest:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-ingest:${IMAGE_TAG:-latest}

  orchestrator:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-orchestrator:${IMAGE_TAG:-latest}

  mcp-ariadne:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-mcp-ariadne:${IMAGE_TAG:-latest}

  mcp-docs:
    image: ${ARIADNE_IMAGE_REGISTRY:-ghcr.io/kreodevs/ariadne}-mcp-docs:${IMAGE_TAG:-latest}
