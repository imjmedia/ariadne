# Dev local: expone puertos de DB y API para conectar desde el host
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Producción: solo docker-compose.yml (sin este archivo)
#
# Host ports (evitar choque con OBP :3000 y costos-api :3001 / Redis :6380):
# - Frontend: 5174 → contenedor 80 (5173 suele estar ocupado por The Forge / Vite)
# - API Nest: 4000 → contenedor 3000
# - Orquestador: 4001 → contenedor 3001
# - Redis auxiliar Ariadne: 6381 → 6379 (costos-api suele usar 6380)
services:
  falkordb:
    ports:
      # Host 6379 often collides with other FalkorDB stacks (e.g. theforge); use 6382 for Ariadne dev.
      - "6382:6379"

  postgres:
    ports:
      - "5432:5432"

  redis:
    # Host 6380 often collides with costos-api (REDIS_PUBLISH_PORT); use 6381 for AriadneSpecs dev.
    ports:
      - "6381:6379"

  api:
    ports:
      - "4000:3000"
    # Sin OTP_DEV_MODE en .env el compose base inyecta cadena vacía; aquí default true para OTP local sin SMTP.
    environment:
      - OTP_DEV_MODE=${OTP_DEV_MODE:-true}
      # CORS (dev) — incluir origen del frontend y Vite/OBP en :3000 si aplica
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,http://127.0.0.1:3000}
      - GRAPH_EXPLORER_DEBUG=${GRAPH_EXPLORER_DEBUG:-1}

  ingest:
    ports:
      - "3002:3002"
    # Libera la cola si un sync queda colgado (p. ej. Falkor ECONNRESET). 0 = sin timeout (comportamiento prod base).
    environment:
      - BULL_SYNC_JOB_TIMEOUT_MS=${BULL_SYNC_JOB_TIMEOUT_MS:-3600000}

  orchestrator:
    ports:
      - "4001:3001"

  # MCP Streamable HTTP: host 9888 → contenedor 8080 (8080 suele estar ocupado por Apache/u otros).
  # Cursor: http://127.0.0.1:9888/mcp
  mcp-ariadne:
    ports:
      - "127.0.0.1:9888:8080"
    environment:
      # Pruebas locales sin token MCP en Cursor (no usar en exposición pública).
      - MCP_HTTP_ALLOW_UNAUTHENTICATED=${MCP_HTTP_ALLOW_UNAUTHENTICATED:-true}

  frontend:
    ports:
      - "5174:80"
    build:
      args:
        # Navegador en el host: API dev publicado en :4000 (ver comentario al inicio de este archivo).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
