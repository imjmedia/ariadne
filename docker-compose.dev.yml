# Dev local: expone puertos de DB y API para conectar desde el host
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Producción: solo docker-compose.yml (sin este archivo)
services:
  falkordb:
    ports:
      - "6379:6379"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6380:6379"

  api:
    ports:
      - "3000:3000"
    # Sin OTP_DEV_MODE en .env el compose base inyecta cadena vacía; aquí default true para OTP local sin SMTP.
    environment:
      - OTP_DEV_MODE=${OTP_DEV_MODE:-true}
      # Si no defines CORS_ORIGIN en .env, permite localhost y 127.0.0.1 (evita "Failed to fetch" por CORS).
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}

  ingest:
    ports:
      - "3002:3002"

  orchestrator:
    ports:
      - "3001:3001"

  frontend:
    ports:
      - "5173:80"
    build:
      args:
        # Navegador en el host: el API expuesto es :3000 (no uses http://api:3000 aquí).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
