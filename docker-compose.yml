services:
  # Base de Datos de Grafos (El Cerebro) — FalkorDB 4.16+ incluye vecf32 / VECTOR INDEX para embed-index y MCP.
  # (v4.0.x es muy antigua; si ves "FalkorDB no expone vecf32", sube de imagen y reinicia con el volumen migrado/respaldado.)
  # Sin puertos expuestos: solo accesible desde contenedores de la red
  falkordb:
    image: falkordb/falkordb:v4.16.5
    platform: linux/amd64
    container_name: ariadnespecs-db
    # Evita MISCONF durante reindex pesado: BGSAVE falla si el grafo no está sincronizado (matrices GraphBLAS).
    environment:
      # Evita MISCONF durante reindex pesado: BGSAVE falla si el grafo no está sincronizado (matrices GraphBLAS).
      REDIS_ARGS: '--save "" --stop-writes-on-bgsave-error no'
      # Tras arrancar, si hay ráfagas de Cypher: redis-cli GRAPH.CONFIG SET MAX_QUEUED_QUERIES 2048

    volumes:
      - falkordb_data:/data
    networks:
      - falkor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # PostgreSQL — repos, sync_jobs, indexed_files (microservicio de ingesta)
  # Sin puertos expuestos: solo accesible desde contenedores de la red
  postgres:
    image: postgres:16-alpine
    container_name: ariadnespecs-postgres
    environment:
      POSTGRES_USER: falkorspecs
      POSTGRES_PASSWORD: falkorspecs
      POSTGRES_DB: falkorspecs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - falkor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falkorspecs -d falkorspecs"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Stack — persistencia estados de agentes y caché de fragmentos (constitution §2.B)
  # Sin puertos expuestos: solo accesible desde contenedores de la red
  redis:
    image: redis:7-alpine
    container_name: ariadnespecs-redis
    # Cola BullMQ + caché MCP: sin RDB; estado de sync vive en Postgres.
    command: >
      redis-server
      --save ""
      --appendonly no
      --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data
    networks:
      - falkor-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Frontend — UI admin del ingest (repos, sync, jobs)
  # Dokploy Domains UI: ariadne.kreoint.mx path / → 80
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-https://ariadne.kreoint.mx}"
        VITE_SSO_URL: "${VITE_SSO_URL-}"
    # En VPS lentos: export COMPOSE_PARALLEL_LIMIT=2 antes del deploy (ver docker/README.md)
    networks:
      - falkor-net
      - dokploy-network
    expose:
      - "80"

  # API REST — proxy a ingest, /graph, /openapi, /health
  # Dokploy Domains UI: ariadne.kreoint.mx path /api → 3000
  # Auth OTP: definir en Dokploy Environment o en .env del proyecto
  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - INGEST_URL=http://ingest:3002
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES=${JWT_EXPIRES:-604800}
      - OTP_DEV_MODE=${OTP_DEV_MODE:-}
    depends_on:
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingest:
        condition: service_started
    networks:
      - falkor-net
      - dokploy-network
    expose:
      - "3000"

  # Microservicio de Ingesta (repos + full sync + webhook Bitbucket)
  # Sin puerto expuesto: el frontend usa la API (proxy) como puerta de entrada
  ingest:
    build:
      context: .
      dockerfile: ./services/ingest/Dockerfile
    container_name: ariadnespecs-ingest
    environment:
      - PORT=3002
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=falkorspecs
      - PGPASSWORD=falkorspecs
      - PGDATABASE=falkorspecs
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKOR_FLUSH_ALL_ONCE=${FALKOR_FLUSH_ALL_ONCE:-}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
      - ORCHESTRATOR_URL=http://orchestrator:3001
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - falkor-net

  # Orquestador NestJS + LangGraph (constitution §2.C)
  # Sin puerto expuesto: proxy enruta por orchestrator:3001
  orchestrator:
    build:
      context: .
      dockerfile: ./services/orchestrator/Dockerfile
    container_name: ariadnespecs-orchestrator
    environment:
      - PORT=3001
      - ARIADNESPEC_API_URL=http://api:3000/api
      - INGEST_URL=http://ingest:3002
      - REDIS_URL=redis://redis:6379
    depends_on:
      api:
        condition: service_started
      ingest:
        condition: service_started
    networks:
      - falkor-net

  # Servidor MCP (El Oráculo). Streamable HTTP para producción (Dokploy).
  # Cursor/IA por URL Streamable MCP. Bearer a `/mcp`: Secret MCP `ari_*` del usuario (validado vía ingest), reenvío al Nest.
  mcp-ariadne:
    build:
      context: .
      dockerfile: ./services/mcp-ariadne/Dockerfile
    container_name: ariadnespecs-mcp
    environment:
      - PORT=8080
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKOR_SHARD_BY_PROJECT=${FALKOR_SHARD_BY_PROJECT:-false}
      - FALKOR_SHARD_BY_DOMAIN=${FALKOR_SHARD_BY_DOMAIN:-false}
      - INGEST_URL=http://ingest:3002
      # Caché de herramientas MCP (get_component_graph, legacy impact, …): misma Redis que api/ingest.
      # Opcional: MCP_REDIS_URL (prioridad sobre REDIS_URL), MCP_REDIS_DISABLED=1 → solo memoria.
      - REDIS_URL=redis://redis:6379
      - ARIADNE_API_URL=${ARIADNE_API_URL:-http://api:3000}
    depends_on:
      falkordb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - falkor-net
      - dokploy-network
    expose:
      - "8080"

  # Servidor MCP de documentación estructurada (docs_mcp/). Complementa mcp-ariadne (grafo).
  mcp-docs:
    build:
      context: .
      dockerfile: ./services/mcp-docs/Dockerfile
    container_name: ariadne-docs-mcp
    environment:
      - PORT=8081
      - DOCS_MCP_DIR=/docs_mcp
    networks:
      - dokploy-network
    expose:
      - "8081"

networks:
  falkor-net:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  falkordb_data:
  postgres_data:
  redis_data:
