# Construye y publica imágenes en GHCR. Dokploy hace pull (docker-compose.prod.yml) — sin compilar en el VPS.
name: Build & push images

on:
  push:
    branches: [master, main]
    paths:
      - "packages/ariadne-common/**"
      - "services/**"
      - "frontend/**"
      - "docker/**"
      - "docs/**"
      - "docs_mcp/**"
      - "SKILLS.md"
      - "docker-compose*.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ariadne

permissions:
  contents: read
  packages: write

jobs:
  build-common:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-common
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ariadne-common
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mcp-export:
    needs: build-common
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-mcp-export
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/mcp-ariadne/Dockerfile
          target: mcp-export
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ARIADNE_COMMON_IMAGE=${{ env.IMAGE_PREFIX }}-common:${{ needs.build-common.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-services:
    needs: [build-common, build-mcp-export]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: services/api/Dockerfile
          - name: ingest
            file: services/ingest/Dockerfile
          - name: orchestrator
            file: services/orchestrator/Dockerfile
          - name: mcp-ariadne
            file: services/mcp-ariadne/Dockerfile
          - name: mcp-docs
            file: services/mcp-docs/Dockerfile
          - name: frontend
            file: frontend/Dockerfile
            mcp_export: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ARIADNE_COMMON_IMAGE=${{ env.IMAGE_PREFIX }}-common:${{ needs.build-common.outputs.short_sha }}
            MCP_EXPORT_IMAGE=${{ matrix.mcp_export && format('{0}-mcp-export:{1}', env.IMAGE_PREFIX, needs.build-common.outputs.short_sha) || '' }}
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://relicai.obp.mx' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
