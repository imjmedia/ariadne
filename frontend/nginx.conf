server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API Nest — proxy cuando Traefik enruta todo el dominio al frontend (POST /api/* → 405 sin esto).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA: todas las rutas sirven index.html para client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache estático para assets con hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Tarball MCP para npx (sin cache largo para que redeploys actualicen)
    location /mcp/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
