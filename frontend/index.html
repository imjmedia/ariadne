<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark light" />
    <title>Ariadne — Ingest Admin</title>
    <script>
      (function () {
        try {
          var K = 'ariadne-theme';
          var stored = localStorage.getItem(K);
          var mode = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          if (mode === 'light') {
            root.classList.add('light');
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
            root.classList.remove('light');
          }
          root.style.colorScheme = mode === 'light' ? 'light' : 'dark';
          var themeColor = mode === 'light' ? '#f8fafc' : '#020617';
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', themeColor);
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme)
            metaScheme.setAttribute('content', mode === 'light' ? 'light dark' : 'dark light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
